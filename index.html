<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>句子练习 · Unit 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(150deg, #ffe4ec 0%, #f3d5f0 25%, #e0d4f5 50%, #d8e5f7 75%, #e4f0fa 100%);
    min-height: 100vh; color: #2c2340;
    display: flex; justify-content: center; align-items: flex-start; padding: 12px;
  }
  .app {
    width: 100%; max-width: 700px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: 30px; padding: 22px 20px 26px;
    box-shadow: 0 30px 60px -30px rgba(150,90,180,0.35);
    display: flex; flex-direction: column;
    min-height: calc(100vh - 24px);
  }
  .hidden { display: none !important; }

  /* 开始页 */
  .start-page { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; text-align:center; padding:30px 10px; }
  .game-title { font-size:36px; font-weight:900;
    background: linear-gradient(135deg, #ff7eb0, #c17cf5, #6db6f0);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing:2px; margin-bottom:8px; }
  .game-sub { font-size:15px; color:#8a6aaa; letter-spacing:1px; margin-bottom:12px; }
  .unit-badge { display:inline-block;
    background: linear-gradient(135deg, #b47cff, #8b5cf6); color:#fff;
    padding:8px 26px; border-radius:22px; font-size:16px; font-weight:800;
    letter-spacing:1px; margin-bottom:26px;
    box-shadow: 0 10px 22px -10px rgba(139,92,246,0.7); }
  .start-rules { background: rgba(255,255,255,0.7); border-radius:18px;
    padding:18px 22px; text-align:left; font-size:14px; color:#555;
    line-height:2; margin-bottom:26px; max-width:420px; }
  .start-rules b { color:#4a2c6b; }
  .start-btn { background: linear-gradient(135deg, #b47cff, #8b5cf6);
    color:#fff; border:none; padding:18px 60px; border-radius:20px;
    font-size:20px; font-weight:800; letter-spacing:2px; cursor:pointer;
    box-shadow: 0 15px 30px -10px rgba(139,92,246,0.7); transition:all 0.15s; }
  .start-btn:active { transform: scale(0.96); }

  /* 游戏页顶部 */
  .game-top { display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px; gap:8px; flex-wrap:wrap; }
  .top-left, .top-right { display:flex; gap:8px; align-items:center; }
  .back-btn { font-size:14px; font-weight:700; color:#6b4a8a; cursor:pointer;
    padding:8px 14px; border-radius:12px; background: rgba(255,255,255,0.85); }
  .back-btn:active { transform: scale(0.95); }
  .pill { background: rgba(255,255,255,0.9); padding:8px 14px; border-radius:22px;
    font-size:14px; font-weight:700; color:#6b4a8a; display:flex;
    align-items:center; gap:6px;
    box-shadow: 0 4px 12px -6px rgba(150,90,180,0.25); }
  .pill.timer { border:2px solid #ffb74d; color:#e65100; }
  .pill.timer.warning { animation: pulse 0.5s infinite alternate; border-color:#f44336; }
  @keyframes pulse { from{transform:scale(1);} to{transform:scale(1.08);} }
  .pill .num { font-variant-numeric: tabular-nums; font-size:17px; }
  .ctrl-btn { background: rgba(255,255,255,0.9);
    border:2px solid rgba(180,124,255,0.2); border-radius:14px;
    padding:8px 12px; font-size:13px; font-weight:700; color:#6b4a8a;
    cursor:pointer; display:flex; align-items:center; gap:4px; transition:all 0.15s; }
  .ctrl-btn:active { transform: scale(0.95); }
  .ctrl-btn.muted { background: rgba(200,200,200,0.6); color:#888; }

  /* 题目卡片 */
  .question-card { background: rgba(255,255,255,0.92); border-radius:24px;
    padding:22px 18px; margin-bottom:16px;
    box-shadow: 0 12px 30px -14px rgba(80,40,120,0.25);
    border:2px solid rgba(255,255,255,1);
    animation: cardIn 0.4s ease; }
  @keyframes cardIn { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }
  .question-emoji { text-align:center; font-size:68px; line-height:1;
    margin-bottom:14px; filter: drop-shadow(0 6px 12px rgba(150,90,180,0.2)); }
  .question-sentence { font-size:22px; font-weight:700; color:#3a2a5a;
    text-align:center; line-height:1.5; margin-bottom:14px; word-break:break-word; }
  .blank { display:inline-block; min-width:90px; border-bottom:3px solid #b47cff;
    padding:0 8px; color:#b47cff; font-weight:800; transition:all 0.3s; }
  .blank.filled { color:#16a34a; border-bottom-color:#16a34a; }
  .hint-box-wrap { text-align:center; }
  .hint-box { text-align:center; font-size:14px; color:#8a6aaa;
    background: rgba(180,124,255,0.1); padding:8px 16px; border-radius:12px;
    display:inline-block; }

  /* 选项 */
  .options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .opt { background: rgba(255,255,255,0.95); border:2.5px solid #ffd6e2;
    border-radius:16px; padding:16px 12px; font-size:17px; font-weight:700;
    color:#3a2a5a; cursor:pointer; transition:all 0.18s;
    box-shadow: 0 4px 12px -6px rgba(150,90,180,0.2);
    text-align:center; display:flex; align-items:center; justify-content:center;
    gap:8px; min-height:62px; word-break:break-word; }
  .opt .key { font-size:12px; color:#b47cff; font-weight:800;
    background: rgba(180,124,255,0.12); padding:2px 7px; border-radius:8px;
    flex-shrink:0; }
  .opt:hover { transform: translateY(-2px); }
  .opt:active { transform: scale(0.97); }
  .opt.correct { background: linear-gradient(135deg, #6ee7a0, #34d399) !important;
    border-color:#10b981 !important; color:#fff !important; }
  .opt.correct .key { color:#fff; background: rgba(255,255,255,0.25); }
  .opt.wrong { background: linear-gradient(135deg, #ff9b9b, #f87171) !important;
    border-color:#ef4444 !important; color:#fff !important; animation: shake 0.4s; }
  .opt.wrong .key { color:#fff; background: rgba(255,255,255,0.25); }
  .opt.disabled { pointer-events:none; opacity:0.55; }
  .opt.dim { opacity:0.4; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* 底部 */
  .bottom-bar { display:flex; justify-content:space-between; align-items:center;
    gap:10px; }
  .score-mini { font-size:13px; font-weight:700; color:#555;
    display:flex; gap:12px; }
  .score-mini .ok { color:#16a34a; }
  .score-mini .no { color:#dc2626; }
  .next-btn { background: linear-gradient(135deg, #b47cff, #8b5cf6);
    color:#fff; border:none; padding:12px 26px; border-radius:14px;
    font-size:15px; font-weight:800; cursor:pointer;
    box-shadow: 0 8px 18px -8px rgba(139,92,246,0.7);
    transition:all 0.15s; letter-spacing:1px; }
  .next-btn:active { transform: scale(0.96); }
  .next-btn.hidden { visibility: hidden; }
  .feedback-tip { text-align:center; font-size:13px; font-weight:700;
    margin-top:10px; height:20px; letter-spacing:0.5px; }
  .feedback-tip.ok { color:#16a34a; }
  .feedback-tip.no { color:#dc2626; }

  /* 结果页 */
  .result-overlay { position:fixed; inset:0;
    background: linear-gradient(150deg, #ffe4ec 0%, #f3d5f0 25%, #e0d4f5 50%, #d8e5f7 75%, #e4f0fa 100%);
    display:flex; justify-content:center; align-items:center;
    z-index:1000; padding:20px; overflow-y:auto; }
  .result-card { background: rgba(255,255,255,0.95); border-radius:32px;
    padding:36px 28px; max-width:500px; width:100%; text-align:center;
    box-shadow: 0 30px 60px -20px rgba(150,90,180,0.4);
    animation: cardIn 0.55s cubic-bezier(0.18,0.89,0.32,1.28);
    max-height:90vh; overflow-y:auto; }
  .result-grade { font-size:96px; font-weight:900; line-height:1;
    margin-bottom:8px;
    background: linear-gradient(135deg, #ff7eb0, #c17cf5, #6db6f0);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradePop 0.6s cubic-bezier(0.18,0.89,0.32,1.28); }
  @keyframes gradePop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-name { font-size:28px; font-weight:900; color:#4a2c6b;
    margin-bottom:6px; }
  .result-cheer { font-size:17px; font-weight:700; color:#8a6aaa;
    margin-bottom:20px; letter-spacing:1px; }
  .result-detail { display:flex; justify-content:center; gap:10px;
    margin-bottom:20px; flex-wrap:wrap; }
  .result-detail .stat { background: rgba(180,124,255,0.12);
    padding:12px 18px; border-radius:14px; font-size:13px;
    color:#6b4a8a; font-weight:700; }
  .result-detail .stat .val { display:block; font-size:20px; color:#b47cff; margin-top:2px; }
  .wrong-list { background: rgba(255,180,180,0.15); border-radius:14px;
    padding:14px 16px; margin-bottom:20px; text-align:left;
    max-height:220px; overflow-y:auto; }
  .wrong-list h4 { font-size:14px; color:#c2185b; margin-bottom:10px;
    letter-spacing:1px; }
  .wrong-item { font-size:13px; color:#555; padding:8px 0;
    border-bottom:1px dashed rgba(180,124,255,0.2); line-height:1.6; }
  .wrong-item:last-child { border-bottom:none; }
  .wrong-item .your { color:#dc2626; font-weight:700; }
  .wrong-item .right { color:#16a34a; font-weight:700; }
  .result-btns { display:flex; gap:12px; }
  .result-btn { flex:1; padding:15px; border-radius:16px;
    font-size:15px; font-weight:800; cursor:pointer; border:none; transition:all 0.15s; }
  .result-btn.primary { background: linear-gradient(135deg, #b47cff, #8b5cf6);
    color:#fff; box-shadow: 0 10px 20px -8px rgba(139,92,246,0.6); }
  .result-btn.secondary { background: rgba(255,255,255,0.9);
    color:#4a2c6b; border:2px solid rgba(180,124,255,0.3); }
  .result-btn:active { transform: scale(0.96); }

  @media (max-width:500px) {
    .app { padding:16px 14px 22px; border-radius:24px; }
    .game-title { font-size:28px; }
    .question-emoji { font-size:56px; }
    .question-sentence { font-size:18px; }
    .opt { font-size:15px; padding:14px 8px; min-height:56px; }
    .opt .key { font-size:11px; padding:1px 5px; }
    .result-grade { font-size:80px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- 开始页 -->
  <div id="startPage" class="start-page">
    <div class="game-title">✏️ 句子练习</div>
    <div class="game-sub">看句子 · 选对词 · 学语法</div>
    <div class="unit-badge">Unit 1</div>
    <div class="start-rules">
      🎯 共 <b>10 道题</b>，总时长 <b>60 秒</b><br>
      ✅ 答对：自动跳下一题<br>
      ❌ 答错：看答案后点「下一题」<br>
      🔊 答对后自动朗读完整句子<br>
      🏆 评级：<b>S</b>（≤40秒 + ≥8对）<br>
      🅰️ 评级：<b>A</b>（≤55秒 + ≥6对）<br>
      💪 其余为 <b>C</b>
    </div>
    <button class="start-btn" onclick="startGame()">开始练习</button>
  </div>

  <!-- 游戏页 -->
  <div id="gamePage" class="hidden" style="display:flex; flex-direction:column; flex:1;">
    <div class="game-top">
      <div class="top-left">
        <div class="back-btn" onclick="backHome()">← 返回</div>
      </div>
      <div class="top-right">
        <div class="pill timer" id="timerPill">⏱ <span class="num" id="timeText">60</span>s</div>
        <div class="pill">🎯 <span class="num" id="progressText">1/10</span></div>
        <button class="ctrl-btn" id="soundBtn" onclick="toggleSound()">
          <span id="soundIcon">🔊</span>
        </button>
      </div>
    </div>

    <div class="question-card">
      <div class="question-emoji" id="questionEmoji">🏯</div>
      <div class="question-sentence" id="questionSentence">—</div>
      <div class="hint-box-wrap">
        <div class="hint-box" id="hintBox">💡 提示：—</div>
      </div>
    </div>

    <div class="options" id="optionsContainer"></div>

    <div class="bottom-bar">
      <div class="score-mini">
        <span class="ok">✅ <span id="okCount">0</span></span>
        <span class="no">❌ <span id="noCount">0</span></span>
      </div>
      <button class="next-btn hidden" id="nextBtn" onclick="goNext()">下一题 →</button>
    </div>

    <div class="feedback-tip" id="feedbackTip"></div>
  </div>

</div>

<!-- 结果页 -->
<div id="resultPage" class="result-overlay hidden">
  <div class="result-card">
    <div class="result-grade" id="resultGrade">S</div>
    <div class="result-name" id="resultTitle">超神！</div>
    <div class="result-cheer" id="resultCheer">太厉害了！</div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="wrong-list hidden" id="wrongList">
      <h4>❌ 错题回顾</h4>
      <div id="wrongListContent"></div>
    </div>
    <div class="result-btns">
      <button class="result-btn secondary" onclick="backHome()">回到首页</button>
      <button class="result-btn primary" onclick="retrySame()">再练一次</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
/* ============================================================
   配置
   ============================================================ */
const TOTAL_TIME = 60;
const QUESTIONS_PER_ROUND = 10;

/* ============================================================
   音效开关
   ============================================================ */
let soundEnabled = true;
function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundIcon').textContent = soundEnabled ? '🔊' : '🔇';
  document.getElementById('soundBtn').classList.toggle('muted', !soundEnabled);
  if (!soundEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
}

/* ============================================================
   音效（Web Audio API）
   ============================================================ */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playCheerSound() {
  if (!soundEnabled) return;
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now + i * 0.06);
    gain.gain.setValueAtTime(0.0001, now + i * 0.06);
    gain.gain.exponentialRampToValueAtTime(0.22, now + i * 0.06 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.06 + 0.25);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.3);
  });
  const size = ctx.sampleRate * 0.7;
  const buf = ctx.createBuffer(1, size, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < size; i++) {
    const env = Math.pow(1 - i / size, 2);
    data[i] = (Math.random() * 2 - 1) * env * 0.3;
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1800;
  filter.Q.value = 0.8;
  const g2 = ctx.createGain();
  g2.gain.value = 0.55;
  src.connect(filter); filter.connect(g2); g2.connect(ctx.destination);
  src.start(now + 0.1);
}
function playBooSound() {
  if (!soundEnabled) return;
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  [392, 349.23, 293.66].forEach((f, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f, now + i * 0.07);
    osc.frequency.linearRampToValueAtTime(f * 0.7, now + i * 0.07 + 0.18);
    gain.gain.setValueAtTime(0.0001, now + i * 0.07);
    gain.gain.exponentialRampToValueAtTime(0.13, now + i * 0.07 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.07 + 0.22);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now + i * 0.07); osc.stop(now + i * 0.07 + 0.28);
  });
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.linearRampToValueAtTime(120, now + 0.4);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.2, now + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.5);
}
function playTickSound() {
  if (!soundEnabled) return;
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(880, now);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.08, now + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.08);
}
function playVictorySound() {
  if (!soundEnabled) return;
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const size = ctx.sampleRate * 2.5;
  const buf = ctx.createBuffer(1, size, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < size; i++) {
    const env = Math.pow(1 - i / size, 1.2);
    data[i] = (Math.random() * 2 - 1) * env * 0.35;
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 2000;
  filter.Q.value = 0.6;
  const g = ctx.createGain();
  g.gain.value = 0.6;
  src.connect(filter); filter.connect(g); g.connect(ctx.destination);
  src.start(now);
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const osc = ctx.createOscillator(), gg = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now + 0.2 + i * 0.12);
    gg.gain.setValueAtTime(0.0001, now + 0.2 + i * 0.12);
    gg.gain.exponentialRampToValueAtTime(0.18, now + 0.2 + i * 0.12 + 0.03);
    gg.gain.exponentialRampToValueAtTime(0.0001, now + 0.2 + i * 0.12 + 0.5);
    osc.connect(gg); gg.connect(ctx.destination);
    osc.start(now + 0.2 + i * 0.12); osc.stop(now + 0.2 + i * 0.12 + 0.6);
  });
}

/* ============================================================
   语音朗读
   ============================================================ */
let voices = [];
function loadVoices() { if (window.speechSynthesis) voices = window.speechSynthesis.getVoices(); }
if (window.speechSynthesis) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function speakSentence(text) {
  if (!soundEnabled) return;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    u.pitch = 1.0;
    let chosen = null;
    for (const v of voices) {
      if (v.lang === 'en-GB') { chosen = v; break; }
      if (v.lang.startsWith('en') && !chosen) chosen = v;
    }
    if (chosen) u.voice = chosen;
    window.speechSynthesis.speak(u);
  }, 80);
}

/* ============================================================
   状态
   ============================================================ */
let currentQuestions = [];
let currentIndex = 0;
let answered = false;
let okCount = 0, noCount = 0;
let timeLeft = TOTAL_TIME;
let timerId = null;
let autoNextTimer = null;
let wrongRecords = [];

const startPage = document.getElementById('startPage');
const gamePage = document.getElementById('gamePage');
const resultPage = document.getElementById('resultPage');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================
   开始游戏
   ============================================================ */
function startGame() {
  currentQuestions = shuffle(UNIT1_QUESTIONS).slice(0, QUESTIONS_PER_ROUND);
  currentIndex = 0;
  okCount = 0; noCount = 0;
  wrongRecords = [];
  timeLeft = TOTAL_TIME;
  document.getElementById('okCount').textContent = '0';
  document.getElementById('noCount').textContent = '0';
  document.getElementById('timeText').textContent = timeLeft;
  document.getElementById('timerPill').classList.remove('warning');

  startPage.classList.add('hidden');
  resultPage.classList.add('hidden');
  const gp = document.getElementById('gamePage');
  gp.classList.remove('hidden');
  gp.style.display = 'flex';
  gp.style.flexDirection = 'column';
  gp.style.flex = '1';

  startTimer();
  renderQuestion();
}

/* ============================================================
   计时器
   ============================================================ */
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('timeText').textContent = Math.max(0, timeLeft);
    if (timeLeft <= 10 && timeLeft > 0) {
      document.getElementById('timerPill').classList.add('warning');
      playTickSound();
    }
    if (timeLeft <= 0) {
      clearInterval(timerId);
      endGame();
    }
  }, 1000);
}

/* ============================================================
   渲染题目
   ============================================================ */
function renderQuestion() {
  clearTimeout(autoNextTimer);
  if (currentIndex >= currentQuestions.length) { endGame(); return; }

  const q = currentQuestions[currentIndex];
  answered = false;
  document.getElementById('progressText').textContent = `${currentIndex + 1}/${currentQuestions.length}`;
  document.getElementById('questionEmoji').textContent = q.emoji;
  document.getElementById('hintBox').textContent = '💡 提示：' + q.hint;
  document.getElementById('feedbackTip').textContent = '';
  document.getElementById('feedbackTip').className = 'feedback-tip';

  const sentenceHTML = q.sentence.replace('______', '<span class="blank">______</span>');
  document.getElementById('questionSentence').innerHTML = sentenceHTML;

  const opts = shuffle(q.options);
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const keys = ['A', 'B', 'C', 'D'];
  opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.value = opt;
    div.innerHTML = `<span class="key">${keys[i]}</span>${opt}`;
    div.addEventListener('click', () => handleAnswer(div, opt));
    container.appendChild(div);
  });

  document.getElementById('nextBtn').classList.add('hidden');
}

/* ============================================================
   答题
   ============================================================ */
function handleAnswer(el, chosen) {
  if (answered) return;
  answered = true;

  const q = currentQuestions[currentIndex];
  const isCorrect = chosen === q.answer;
  const blank = document.querySelector('.blank');

  document.querySelectorAll('.opt').forEach(o => o.classList.add('disabled'));

  if (isCorrect) {
    el.classList.add('correct');
    okCount++;
    document.getElementById('okCount').textContent = okCount;
    playCheerSound();

    if (blank) {
      blank.textContent = chosen;
      blank.classList.add('filled');
    }

    const tip = document.getElementById('feedbackTip');
    tip.textContent = '✅ 答对啦！' + (soundEnabled ? ' 🔊 正在朗读…' : '');
    tip.className = 'feedback-tip ok';

    speakSentence(q.full);

    autoNextTimer = setTimeout(() => {
      currentIndex++;
      renderQuestion();
    }, 1200);

  } else {
    el.classList.add('wrong');
    noCount++;
    document.getElementById('noCount').textContent = noCount;
    playBooSound();

    document.querySelectorAll('.opt').forEach(o => {
      if (o.dataset.value === q.answer) o.classList.add('correct');
      else o.classList.add('dim');
    });

    if (blank) {
      blank.textContent = q.answer;
      blank.classList.add('filled');
    }

    // 记录错题
    wrongRecords.push({
      sentence: q.sentence,
      answer: q.answer,
      chosen: chosen,
      full: q.full
    });

    const tip = document.getElementById('feedbackTip');
    tip.textContent = `❌ 正确答案是「${q.answer}」，点击「下一题」继续`;
    tip.className = 'feedback-tip no';

    document.getElementById('nextBtn').classList.remove('hidden');
  }
}

function goNext() {
  clearTimeout(autoNextTimer);
  currentIndex++;
  renderQuestion();
}

/* ============================================================
   结束 + 评级
   ============================================================ */
function endGame() {
  clearInterval(timerId);
  clearTimeout(autoNextTimer);
  gamePage.classList.add('hidden');
  resultPage.classList.remove('hidden');

  const done = okCount + noCount;
  const usedTime = TOTAL_TIME - Math.max(0, timeLeft);

  // 评级
  let grade = 'C', title = '继续加油！', cheer = '多练几次会更好';
  if (okCount >= TIME_GRADE.S.minCorrect && usedTime <= TIME_GRADE.S.maxTime) {
    grade = 'S'; title = '超神！'; cheer = '又准又快，太厉害了！';
  } else if (okCount >= TIME_GRADE.A.minCorrect && usedTime <= TIME_GRADE.A.maxTime) {
    grade = 'A'; title = '很棒！'; cheer = '离 S 级只差一点点！';
  } else {
    grade = 'C'; title = '继续加油！'; cheer = '下次一定能更好';
  }

  document.getElementById('resultGrade').textContent = grade;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultCheer').textContent = cheer;

  document.getElementById('resultDetail').innerHTML = `
    <div class="stat">用时<span class="val">${usedTime}s</span></div>
    <div class="stat">✅ 正确<span class="val">${okCount}</span></div>
    <div class="stat">❌ 错误<span class="val">${noCount}</span></div>
    <div class="stat">完成<span class="val">${done}/${currentQuestions.length}</span></div>
  `;

  // 错题回顾
  const wrongList = document.getElementById('wrongList');
  const wrongContent = document.getElementById('wrongListContent');
  if (wrongRecords.length > 0) {
    wrongList.classList.remove('hidden');
    wrongContent.innerHTML = wrongRecords.map(r => {
      const parts = r.sentence.split('______');
      return `<div class="wrong-item">
        ${parts[0]}<span class="right">${r.answer}</span>${parts[1] || ''}<br>
        <span style="font-size:12px;color:#999;">你选了：<span class="your">${r.chosen}</span></span>
      </div>`;
    }).join('');
  } else {
    wrongList.classList.add('hidden');
  }

  playVictorySound();
}

/* ============================================================
   返回 / 重练
   ============================================================ */
function backHome() {
  clearInterval(timerId);
  clearTimeout(autoNextTimer);
  gamePage.classList.add('hidden');
  resultPage.classList.add('hidden');
  startPage.classList.remove('hidden');
}

function retrySame() {
  startGame();
}

/* ============================================================
   键盘 A/B/C/D + Enter
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (gamePage.classList.contains('hidden')) return;
  const key = e.key.toUpperCase();
  const idx = ['A','B','C','D'].indexOf(key);
  if (idx >= 0) {
    const opts = document.querySelectorAll('.opt');
    if (opts[idx] && !opts[idx].classList.contains('disabled')) {
      opts[idx].click();
    }
  }
  if (e.key === 'Enter' && !document.getElementById('nextBtn').classList.contains('hidden')) {
    goNext();
  }
});
</script>
